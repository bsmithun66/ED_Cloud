<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Authentication</title><style>

    :root {
  --primary-color: #2563eb;
  --primary-hover: #1d4ed8;
  --bg-color: #f3f4f6;
  --card-bg: #ffffff;
  --text-main: #111827;
  --text-muted: #6b7280;
  --border-color: #d1d5db;
  --error-bg: #fee2e2;
  --error-text: #b91c1c;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  background-color: var(--bg-color);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.auth-container {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}

.auth-card {
  background-color: var(--card-bg);
  padding: 40px 30px;
  border-radius: 12px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

h2 {
  color: var(--text-main);
  font-size: 24px;
  margin-bottom: 8px;
  text-align: center;
}

.subtitle {
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 24px;
  font-size: 14px;
}

.input-group {
  margin-bottom: 16px;
}

.input-group label {
  display: block;
  margin-bottom: 6px;
  color: var(--text-main);
  font-size: 14px;
  font-weight: 500;
}

.input-group input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 14px;
  transition: border-color 0.2s;
}

.input-group input:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.submit-btn {
  width: 100%;
  padding: 12px;
  background-color: var(--primary-color);
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.2s;
  margin-top: 10px;
}

.submit-btn:hover {
  background-color: var(--primary-hover);
}

.toggle-text {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
  color: var(--text-muted);
}

.toggle-link {
  color: var(--primary-color);
  font-weight: 500;
  cursor: pointer;
}

.toggle-link:hover {
  text-decoration: underline;
}

/* Visibility Classes */
.auth-form.hidden {
  display: none;
}

.error-banner {
  background-color: var(--error-bg);
  color: var(--error-text);
  padding: 10px;
  border-radius: 6px;
  font-size: 14px;
  text-align: center;
  margin-bottom: 20px;
}

.error-banner.hidden {
  display: none;
}
  </style>
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Error Message Banner -->
      <div id="error-message" class="error-banner hidden"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please sign in to your account</p>

        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required>
        </div>

        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
        
        <p class="toggle-text">
          Don't have an account? <span class="toggle-link" id="go-to-signup">Sign up</span>
        </p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="auth-form hidden">
        <h2>Create Account</h2>
        <p class="subtitle">Join us today to get started</p>

        <div class="input-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required>
        </div>

        <div class="input-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required>
        </div>

        <div class="input-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
        
        <p class="toggle-text">
          Already have an account? <span class="toggle-link" id="go-to-login">Sign in</span>
        </p>
      </form>

    </div>
  </div>
 <script>
   document.addEventListener('DOMContentLoaded', () => {
  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const goToSignup = document.getElementById('go-to-signup');
  const goToLogin = document.getElementById('go-to-login');
  const errorBanner = document.getElementById('error-message');

  // Helper function to show errors
  function showError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.remove('hidden');
  }

  function hideError() {
    errorBanner.textContent = '';
    errorBanner.classList.add('hidden');
  }

  // Toggle to Signup
  goToSignup.addEventListener('click', () => {
    hideError();
    loginForm.classList.add('hidden');
    signupForm.classList.remove('hidden');
  });

  // Toggle to Login
  goToLogin.addEventListener('click', () => {
    hideError();
    signupForm.classList.add('hidden');
    loginForm.classList.remove('hidden');
  });

  // Handle Login Submit
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    hideError();
    
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    if (password.length < 8) {
      showError('Password must be at least 8 characters.');
      return;
    }

    // Replace this with your actual login logic
    console.log('Logging in with:', email);
    alert('Login simulation successful!');
  });

  // Handle Signup Submit
  signupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    hideError();
    
    const name = document.getElementById('signup-name').value;
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;

    if (password.length < 8) {
      showError('Password must be at least 8 characters.');
      return;
    }

    // Replace this with your actual signup logic
    console.log('Creating account for:', name, email);
    alert('Signup simulation successful!');
  });
});
 </script>
  <!-- <script src="script.js"></script> -->
</body>
</html>
