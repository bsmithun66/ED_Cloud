<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Authentication</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Error Message Banner -->
      <div id="error-message" class="error-banner hidden"></div>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please sign in to your account</p>

        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required>
        </div>

        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
        
        <p class="toggle-text">
          Don't have an account? <span class="toggle-link" id="go-to-signup">Sign up</span>
        </p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" class="auth-form hidden">
        <h2>Create Account</h2>
        <p class="subtitle">Join us today to get started</p>

        <div class="input-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" required>
        </div>

        <div class="input-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required>
        </div>

        <div class="input-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
        
        <p class="toggle-text">
          Already have an account? <span class="toggle-link" id="go-to-login">Sign in</span>
        </p>
      </form>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
